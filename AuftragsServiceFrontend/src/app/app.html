<mat-toolbar class="app-toolbar">
  <mat-icon>assignment</mat-icon>
  <span class="toolbar-title">Auftragsservice</span>
</mat-toolbar>

<div class="page-body">
  <div class="content-row">
    <app-auftrags-navigation
      [aktiv]="aktiveAnsicht()"
      (ansichtWechseln)="ansichtWechseln($event)"
    ></app-auftrags-navigation>

    @if (aktiveAnsicht() === 'erfassen') {
      <app-auftrag-form></app-auftrag-form>
    } @else if (aktiveAnsicht() === 'suchen') {
      <app-auftrag-suchen></app-auftrag-suchen>
    } @else if (aktiveAnsicht() === 'uebersicht') {
      <app-auftrag-uebersicht></app-auftrag-uebersicht>
    }
  </div>
</div>
